allowBuilds:
  esbuild: true
  rolldown: true

# Generated by `pnpm audit --fix override`, forcing patched versions of
# transitive devDependencies flagged by `pnpm audit` (diff/esbuild pulled in
# by tsdown; valibot by tsdown's rolldown; vite by better-auth's own vitest
# chain via @better-auth/test-utils). None of these reach the published
# package (see package.json's `files` — only dist/src/LICENSE ship), and
# `pnpm run test:offline`/build were re-verified against every override
# below before it was added. Re-run `pnpm audit` after any dependency bump;
# remove an override once its package's own direct version naturally clears
# the vulnerable range.
