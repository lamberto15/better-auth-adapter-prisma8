version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Let fresh releases sit a few days before proposing them, so a
    # compromised or quickly-yanked publish is less likely to reach an
    # auto-merged PR (see .github/workflows/dependabot-auto-merge.yml).
    cooldown:
      default-days: 3
    # Groups are matched in order; a dependency joins the first group whose
    # patterns match, so the specific groups must stay above the catch-all.
    groups:
      # Prisma 8 ("Next") is still pre-1.0 (rc.x) and every @prisma/orm-*
      # package in this dependency graph has to move together — a partial
      # bump reintroduces exactly the kind of version-skew bug this adapter
      # spent real effort chasing down and fixing (see CHANGELOG.md). Batch
      # them into one PR instead of one-per-package.
      prisma:
        patterns:
          - "@prisma/*"
      # Same reasoning for Better Auth's own packages.
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      # Everything else that's a minor/patch bump lands as one weekly PR.
      # Majors are left out on purpose so each gets its own PR — they tend to
      # need code changes (e.g. vitest 3 -> 4) and shouldn't block the rest.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
