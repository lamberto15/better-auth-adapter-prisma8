name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # This only *queues* the merge: the main ruleset's required checks (audit,
      # tests on node 22/24, live conformance suite, CodeQL) still have to pass
      # on an up-to-date branch before GitHub actually merges.
      #
      # Excluded, so they always get a human look:
      # - majors, which usually need code changes;
      # - anything touching @prisma/* or better-auth / @better-auth/*, since
      #   those are the libraries this adapter targets and a bump may warrant
      #   widening peerDependencies and adding a changeset.
      #
      # Matched by package name, not dependency-group: when only one package in
      # a group has an update, Dependabot opens a plain single-package PR and
      # dependency-group comes back empty (this let #31 through).
      - name: Enable auto-merge for minor/patch tooling bumps
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          !contains(steps.metadata.outputs.dependency-names, '@prisma/') &&
          !contains(steps.metadata.outputs.dependency-names, 'better-auth')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
