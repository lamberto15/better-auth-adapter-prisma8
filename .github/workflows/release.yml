name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `pnpm/action-setup` (not the newer `pnpm/setup`) deliberately: this
      # job needs `actions/setup-node`'s `registry-url` for npm publish auth,
      # and `pnpm/setup` also installs a Node runtime — running both would
      # install Node twice. `pnpm/action-setup` only installs pnpm.
      - uses: pnpm/action-setup@v6

      # npm Trusted Publishing requires Node >=22.14.0; pinning to 24 (this
      # repo's active-LTS floor — see ci.yml) rather than "22" leaves no
      # doubt a resolved patch version clears that bar.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm run typecheck
          pnpm run test:offline

      # Changesets does one of two things on every push to main:
      #  - if there are pending changeset files (added by a PR under
      #    `.changeset/*.md`), it opens or updates a "Version Packages" PR
      #    that bumps package.json and rewrites CHANGELOG.md — nothing
      #    publishes yet.
      #  - once that PR is merged (so package.json's version already moved
      #    and no changesets remain), it runs `pnpm run release`
      #    (build + `changeset publish`) and publishes to npm.
      #
      # Auth: npm Trusted Publishing (OIDC) — no long-lived token in this
      # repo at all. Deliberately not passing NODE_AUTH_TOKEN: with no auth
      # value in .npmrc, pnpm (>=11.1.3, fixing pnpm/pnpm#11513 — confirm the
      # installed version if this ever starts failing with a 404) falls back
      # to the OIDC token GitHub mints from the `id-token: write` permission
      # above. Configure the matching side on npmjs.com — package Settings →
      # Trusted Publisher → GitHub Actions → organization/user `lamberto15`,
      # repository `better-auth-adapter-prisma8`, workflow filename
      # `release.yml` (must match exactly, case-sensitive), no environment
      # name set (this job doesn't declare one), "npm publish" allowed.
      # Requires npm's own auth-and-writes 2FA mode NOT to be forced on the
      # account for this to run non-interactively — trusted publishing is
      # npm's own recommended replacement for loosening that setting.
      #
      # github-token is a fine-grained PAT (RELEASE_PAT: Contents +
      # Pull requests, read/write, scoped to this repo only), not the
      # default GITHUB_TOKEN. GitHub Actions has a deliberate anti-recursion
      # rule: a PR opened with GITHUB_TOKEN cannot trigger other
      # `pull_request`-triggered workflows — so the "Version Packages" PR
      # this step opens would get zero CI/CodeQL checks, and the branch
      # ruleset's required checks would never have anything to evaluate for
      # it. A real user-authored token (PAT or GitHub App) doesn't carry
      # that restriction. Confirmed against GitHub's own community docs on
      # this exact scenario, not assumed.
      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          github-token: ${{ secrets.RELEASE_PAT }}
